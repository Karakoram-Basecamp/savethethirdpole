# Builds the site and publishes it to GitHub Pages on every push to `main`.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Project sites live at https://<user>.github.io/<repo>/, so the app needs
      # that sub-path as its base. A repo named <user>.github.io, or a site with
      # a custom domain (public/CNAME present), is served from the root instead.
      - name: Work out the base path
        run: |
          REPO="${{ github.event.repository.name }}"
          if [ -f public/CNAME ] || [ "$REPO" = "${{ github.repository_owner }}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build:pages
        env:
          # Optional: set a repository variable FORM_ENDPOINT (e.g. a Formspree URL)
          # to make the contact form send real emails.
          VITE_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
